name: Fed Labor Pivot Data Fetch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-fed-labor.txt

      - name: Run Fed labor pivot fetch
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python fed_labor_pivot.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fed_labor_pivot_monitor.json data/fed_labor_pivot_monitor_brief.json data/fed_labor_pivot_monitor_history.jsonl
          git commit -m "Update Fed labor pivot data" || echo "No changes to commit"
          git push
